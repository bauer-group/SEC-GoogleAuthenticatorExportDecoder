# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors dependencies for security updates and version bumps.
#
# Ecosystems:
#   - npm: Node.js packages (package.json)
#   - github-actions: CI/CD workflow actions
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm (Node.js) dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "17:35"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
    # Groups split by update type, so they never overlap:
    # - npm-minor-and-patch: every minor and patch update in one PR per
    #   run, merged by dependabot-maintenance.yml once nodejs-pr.yml passed.
    #   0.x packages are excluded and keep their own PRs: a 0.y minor
    #   counts as major for the auto-merge gate and would hold the whole
    #   group open.
    # - react, vite, i18next, radix-ui (update-types major):
    #   majors of these packages stay in one PR per group, open for review.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "class-variance-authority"
          - "hi-base32"
        update-types:
          - "minor"
          - "patch"
      # react-dom throws at startup unless react has the exact same version
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
      # vite 8 needs @vitejs/plugin-react >= 6 and vite-plugin-pwa >= 2
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-pwa"
        update-types:
          - "major"
      # react-i18next 18 needs i18next >= 27
      i18next:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
        update-types:
          - "major"
      # Radix primitives share internal packages - update them together
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "major"
    # Limit open PRs to avoid overwhelming
    open-pull-requests-limit: 25
    # Auto-merge patch updates (requires GitHub Actions workflow)
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # GitHub Actions updates
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "17:35"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
