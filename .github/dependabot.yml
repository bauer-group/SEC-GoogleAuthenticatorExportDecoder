# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors dependencies for security updates and version bumps.
#
# Ecosystems:
#   - npm: Node.js packages (package.json)
#   - github-actions: CI/CD workflow actions
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm (Node.js) dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
    # Group minor/patch updates to reduce PR noise.
    # Lock-step groups (incl. major updates) keep packages that must move
    # together in one PR. Their packages are excluded from the generic
    # dev/production groups below: Dependabot does not use "first match
    # wins" - it ranks a dependency-type group above a wildcard pattern,
    # and an open generic group PR claims every package it matches.
    groups:
      # react-dom throws at startup unless react has the exact same version
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vite 8 needs @vitejs/plugin-react >= 6 and vite-plugin-pwa >= 2
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-pwa"
      # react-i18next 18 needs i18next >= 27
      i18next:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      # Radix primitives share internal packages - update them together
      radix-ui:
        patterns:
          - "@radix-ui/*"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-pwa"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "i18next"
          - "i18next-*"
          - "react-i18next"
          - "@radix-ui/*"
        update-types:
          - "patch"
    # Limit open PRs to avoid overwhelming
    open-pull-requests-limit: 25
    # Auto-merge patch updates (requires GitHub Actions workflow)
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # GitHub Actions updates
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
